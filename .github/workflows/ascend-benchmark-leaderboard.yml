name: Ascend Benchmark Request

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      benchmark_scenario:
        description: Registered workload to submit to 112
        required: true
        type: choice
        default: random-online
        options:
          - random-online
          - sharegpt-online

permissions:
  contents: read

jobs:
  submit-to-112:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          contains(github.event.pull_request.labels.*.name, 'ready') ||
          contains(github.event.pull_request.labels.*.name, 'verified')
        )
      )
    uses: vLLM-HUST/vllm-hust-dev-hub/.github/workflows/evaluation-request.yml@main
    with:
      repository: vLLM-HUST/vllm-hust
      core_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      plugin_repository: vLLM-HUST/vllm-ascend-hust
      plugin_revision: main
      target_id: ${{ inputs.benchmark_scenario == 'sharegpt-online' && 'official-ascend-jan-2026-v0.18.0-sharegpt-online-qwen25-14b-910b2' || 'official-ascend-jan-2026-v0.18.0-random-online-qwen25-14b-910b2' }}
      target_registry_version: 1.3.5
      repeat_count: 3
      npu_count: 1
      priority: ${{ github.event_name == 'push' && 'release' || 'normal' }}
    secrets:
      evaluation_api_url: ${{ secrets.EVALUATION_API_URL }}
      evaluation_api_token: ${{ secrets.EVALUATION_API_TOKEN }}
      evaluation_hmac_secret: ${{ secrets.EVALUATION_HMAC_SECRET }}
