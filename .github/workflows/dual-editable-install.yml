name: Dual Editable Install

on:
  workflow_dispatch:
    inputs:
      vllm_hust_ref:
        description: 'vllm-hust git ref to test (branch, tag, or SHA)'
        required: false
        default: 'main'
      vllm_ascend_hust_ref:
        description: 'vllm-ascend-hust git ref to test (branch, tag, or SHA)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  validate-dual-editable:
    name: Validate dual-editable install
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VLLM_ASCEND_HUST_REPO: ${{ github.workspace }}/vllm-ascend-hust
      VLLM_ASCEND_HUST_REPO_URL: https://github.com/vLLM-HUST/vllm-ascend-hust.git

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.vllm_hust_ref }}

      - uses: astral-sh/setup-uv@7c3e37a066c1e84c46c23cfde3e626bc27991b24 # v6.1.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements/**/*.txt
            pyproject.toml
          python-version: '3.12'

      - name: Checkout vllm-ascend-hust
        run: |
          git clone --depth 1 \
            -b "${{ inputs.vllm_ascend_hust_ref }}" \
            "$VLLM_ASCEND_HUST_REPO_URL" \
            "$VLLM_ASCEND_HUST_REPO"

      - name: Run dual-editable validation
        run: bash scripts/ci/validate_dual_editable_install.sh
